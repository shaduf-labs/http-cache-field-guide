<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache decision tool</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:18px;color:#183b56;background:#f7fafc}fieldset{border:1px solid #cbd5e0;border-radius:10px;margin:0 0 14px;padding:12px}label{display:block;margin:8px 0}select,button{font:inherit;padding:8px;border-radius:7px;border:1px solid #90a4ae}button{background:#1261a0;color:white;cursor:pointer}.result{background:#e6fffa;border-left:4px solid #159a9c;border-radius:6px;padding:12px;line-height:1.5}.warn{color:#9b2c2c;font-weight:600}</style></head><body><h2 style="margin-top:0">Choose a starting policy</h2><fieldset><label>Response class <select id="kind"><option value="personal">Personalized or sensitive</option><option value="public">Public, changes occasionally</option><option value="asset">Fingerprint/versioned asset</option><option value="nostore">Must not be stored</option></select></label><label>Shared cache/CDN may store it? <select id="shared"><option value="no">No</option><option value="yes">Yes</option></select></label><label>Validators available? <select id="validator"><option value="yes">Yes (ETag or Last-Modified)</option><option value="no">No</option></select></label><label>Request carries Authorization? <select id="auth"><option value="no">No</option><option value="yes">Yes</option></select></label></fieldset><button id="go">Show policy</button><div id="out" class="result" role="status" style="margin-top:14px"></div><script>(function(){const $=id=>document.getElementById(id);function show(){let k=$("kind").value,s=$("shared").value,v=$("validator").value,a=$("auth").value,policy,note;if(k==="nostore"){policy="Cache-Control: no-store";note="Compliant HTTP caches should not intentionally store this response. This does not erase an older entry or act as a complete security boundary."}else if(k==="personal"){policy="Cache-Control: private, no-cache";note=a==="yes"?"A private browser cache may retain a user-specific response and validate it with ETag or Last-Modified. A shared cache must not reuse it; Authorization is not a substitute for a safe cache key or privacy policy.":"Keep it in a private cache only, then validate before reuse. Do not add public or s-maxage for personalized content."}else if(k==="asset"){policy="Cache-Control: public, max-age=31536000, immutable";note=a==="yes"?"Only use this for a representation genuinely safe to share despite Authorization, with deliberate cache-key design; otherwise choose a private policy.":"Use only when the URL is versioned/fingerprinted and a new URL is deployed for changed bytes."}else{policy=s==="yes"?"Cache-Control: public, max-age=60, s-maxage=10":"Cache-Control: private, max-age=60";note=a==="yes"&&s==="yes"?"RFC 9111 §3.5 requires an explicit allowing directive before a shared cache may reuse an Authorization response. Share only if the representation is identical and the cache key is deliberately safe; authentication alone does not make it public.":a==="yes"?"With no shared cache, a private policy keeps the response browser-local. If it is user-specific, prefer private, no-cache or no-store.":"Fresh reuse can avoid a request. A stale entry may validate with ETag/Last-Modified; s-maxage affects shared caches only."}$("out").innerHTML="<strong>Starting header</strong><br><code>"+policy+"</code><p>"+note+"</p>"+(k==="personal"&&s==="yes"?'<p class="warn">Warning: a shared cache choice conflicts with personalization. Check cache keys and privacy before shipping.</p>':"")+(a==="yes"&&s==="yes"&&k!=="nostore"?'<p class="warn">Authorization warning: explicit permission is not proof that this response is safe to share.</p>':"")+"<small>Heuristic aid, not a security boundary or vendor-specific configuration.</small>"}$("go").addEventListener("click",show);show()})();</script></body></html>
